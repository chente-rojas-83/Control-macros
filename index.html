<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Macros Semanal</title>
  
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Macros">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .macro-input { transition: all 0.15s ease; }
    .macro-input:focus { transform: scale(1.02); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.4); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden font-sans select-none p-1.5 flex flex-col justify-between">

  <!-- Barra de Instalación Manual PWA -->
  <div id="install-container" class="hidden bg-blue-700 text-white px-2 py-1 text-[11px] flex justify-between items-center sticky top-0 z-50 rounded-lg shadow-md mb-1">
    <span class="font-medium">🚀 ¡Instalar App en pantalla de inicio!</span>
    <button id="btn-install" class="bg-white text-blue-800 font-bold px-2 py-0.5 rounded text-[10px] shrink-0">Instalar</button>
  </div>

  <!-- MODAL: RESUMEN ANÁLISIS Y TABLA COPIABLE -->
  <div id="summary-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-3.5 space-y-3 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-1.5">
        <h3 class="font-extrabold text-slate-900 text-xs flex items-center gap-1">📊 Resumen Semanal Copiable</h3>
        <button onclick="closeSummaryModal()" class="text-slate-400 font-bold text-base px-1">✕</button>
      </div>

      <!-- Configuración rápida de Metas y Mediciones Iniciales -->
      <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 text-[11px] space-y-1.5">
        <div class="font-bold text-slate-800 flex justify-between">
          <span>⚙️ Objetivos y Medidas Base</span>
          <span id="target-cal-display" class="text-blue-600 font-extrabold">0 kcal</span>
        </div>
        <div class="grid grid-cols-3 gap-1">
          <div><label class="block font-bold text-blue-700 text-[8px] uppercase">Prot (g)</label><input type="number" id="target-prot" onchange="updateTargets()" class="w-full bg-white border rounded p-0.5 text-center font-bold text-xs"></div>
          <div><label class="block font-bold text-amber-700 text-[8px] uppercase">Carb (g)</label><input type="number" id="target-carb" onchange="updateTargets()" class="w-full bg-white border rounded p-0.5 text-center font-bold text-xs"></div>
          <div><label class="block font-bold text-emerald-700 text-[8px] uppercase">Grasa (g)</label><input type="number" id="target-fat" onchange="updateTargets()" class="w-full bg-white border rounded p-0.5 text-center font-bold text-xs"></div>
        </div>
        <div class="grid grid-cols-2 gap-1.5 pt-1 border-t border-slate-200">
          <div><label class="text-[9px] text-slate-500 block">Peso Ini/Fin (Kg):</label><div class="flex gap-1"><input type="number" step="0.1" id="peso-inicial" onchange="updateInitialWeight()" class="w-1/2 bg-white border rounded p-0.5 text-center font-bold text-xs"><span id="peso-final-display" class="w-1/2 bg-slate-100 rounded p-0.5 text-center font-bold text-xs">0</span></div></div>
          <div><label class="text-[9px] text-slate-500 block">Talla Ini/Fin (cm):</label><div class="flex gap-1"><input type="number" step="0.1" id="talla-inicial" onchange="updateInitialTalla()" class="w-1/2 bg-white border rounded p-0.5 text-center font-bold text-xs"><input type="number" step="0.1" id="talla-final" onchange="updateFinalTalla()" class="w-1/2 bg-white border rounded p-0.5 text-center font-bold text-xs"></div></div>
        </div>
      </div>

      <!-- TABLA RESUMEN COPIABLE -->
      <div class="overflow-x-auto border border-slate-200 rounded-xl bg-white">
        <table class="w-full text-left text-[10px] border-collapse">
          <thead>
            <tr class="bg-slate-800 text-white font-bold text-[9px] uppercase">
              <th class="p-1.5">Métrica</th>
              <th class="p-1.5 text-center">Prot</th>
              <th class="p-1.5 text-center">Carb</th>
              <th class="p-1.5 text-center">Grasa</th>
              <th class="p-1.5 text-right">Kcal</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 font-semibold text-slate-700">
            <tr class="bg-blue-5
